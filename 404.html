<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · Luca De Rosa</title>
<style>
:root{--paper:oklch(14% 0.048 264);--ink:oklch(95% 0.016 250);--muted:oklch(73% 0.04 256);--accent:oklch(80% 0.11 230);--accent-ink:oklch(16% 0.05 264);--focus:oklch(84% 0.12 228)}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.6 ui-sans-serif,system-ui,sans-serif;padding:0 20px}
main{max-width:34rem;display:flex;flex-direction:column;gap:20px}
h1{font-weight:300;font-size:clamp(2rem,4vw + 1rem,3.5rem);line-height:1.05;margin:0}
p{margin:0;color:var(--muted)}
a{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:500;width:max-content}
a:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>This page wandered off.</h1>
  <p>Whatever was here moved or never existed. The books are all on the front page.</p>
  <a href="/">Back to the books</a>
</main>
</body>
</html>
